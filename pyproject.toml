[project]
name = "ofeeee"
version = "0.1.0"
description = "University attendance system with QR codes and passkeys"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<6.0",
    "djangorestframework>=3.14,<4.0",
    "drf-spectacular>=0.27,<1.0",
    "psycopg[binary]>=3.1,<4.0",
    "django-environ>=0.11,<1.0",
    "gunicorn>=21.2,<22.0",
    "whitenoise>=6.6,<7.0",
    "resend>=2.0,<3.0",
    "python-json-logger>=2.0,<3.0",
    "webauthn>=2.1,<3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1,<1.0",
    "mypy>=1.7,<2.0",
    "django-stubs>=4.2,<5.0",
    "djangorestframework-stubs>=3.14,<4.0",
    "pytest>=7.4,<8.0",
    "pytest-django>=4.7,<5.0",
    "pytest-cov>=4.1,<5.0",
    "factory-boy>=3.3,<4.0",
    "pre-commit>=3.5,<4.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "ARG001",  # unused function argument (often used for interface consistency)
    "B008",    # do not perform function calls in argument defaults (used for Protocol)
    "E501",    # line too long (long test lines are acceptable)
    "F403",    # star imports (used in Django settings)
    "F405",    # star imports (used in Django settings)
]
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "migrations",
]

[tool.ruff.isort]
known-first-party = ["config", "apps"]

[tool.ruff.lint.isort]
known-first-party = ["config", "apps"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = "migrations.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "config.settings.*"
disallow_untyped_defs = false

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = [
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests (no database)",
    "integration: Integration tests (with database)",
]

[tool.coverage.run]
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
]
