{% extends "base.html" %}

{% block title %}Login - POMSOM{% endblock %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 100px auto;">
    <h1 style="margin-bottom: 24px; color: #08f728;">Login</h1>

    <div id="error-message" class="alert alert-error" style="display: none;"></div>

    <form id="login-form">
        <div class="form-group">
            <label for="email">University email</label>
            <input type="email" id="email" name="email" autocomplete="username webauthn" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">
            Sign in with Passkey
        </button>
    </form>

    <p style="margin-top: 20px; text-align: center; color: #08f728;">
        <a href="/activate/" style="color: #08f728;">Activate your account</a>
    </p>
</div>
{% endblock %}

{% block scripts %}
<script type="module">
    function decodeBase64Url(value) {
        const base64 = value.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - value.length % 4) % 4);
        return Uint8Array.from(atob(base64), character => character.charCodeAt(0));
    }

    function encodeBuffer(value) {
        return btoa(String.fromCharCode(...new Uint8Array(value)));
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        setButtonLoading(btn, true);

        try {
            const beginResponse = await fetch('/api/v1/auth/login/begin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: document.getElementById('email').value }),
            });
            const options = await beginResponse.json();
            if (!beginResponse.ok) {
                throw new Error(options.error?.message || 'Could not start passkey sign-in');
            }

            const credential = await navigator.credentials.get({
                publicKey: {
                    challenge: decodeBase64Url(options.challenge),
                    rpId: options.rp_id,
                    timeout: options.timeout,
                    allowCredentials: options.allow_credentials.map(id => ({
                        type: 'public-key',
                        id: decodeBase64Url(id),
                    })),
                    userVerification: 'preferred',
                }
            });

            const response = await fetch('/api/v1/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    credential_id: credential.id,
                    client_data_json: encodeBuffer(credential.response.clientDataJSON),
                    authenticator_data: encodeBuffer(credential.response.authenticatorData),
                    signature: encodeBuffer(credential.response.signature),
                    user_handle: credential.response.userHandle
                        ? encodeBuffer(credential.response.userHandle)
                        : null,
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error?.message || 'Login failed');
            }

            showToast('Login successful!', 'success');
            setTimeout(() => window.location.href = '/', 1000);
        } catch (error) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = error.message;
            errorDiv.style.display = 'block';
            showToast(error.message, 'error');
        } finally {
            setButtonLoading(btn, false);
        }
    });
</script>
{% endblock %}
