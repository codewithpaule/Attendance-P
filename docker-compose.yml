version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: ofeeee_db
    environment:
      POSTGRES_DB: ofeeee
      POSTGRES_USER: ofeeee
      POSTGRES_PASSWORD: ofeeee
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: ofeeee_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ofeeee:ofeeee@db:5432/ofeeee
      - DEBUG=True
    depends_on:
      - db

volumes:
  postgres_data:
