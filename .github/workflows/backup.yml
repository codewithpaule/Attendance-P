name: Backup

on:
  schedule:
    # Weekly backup on Sundays at 04:00 UTC
    - cron: "0 4 * * 0"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install age
        run: |
          curl -sSfL https://raw.githubusercontent.com/FiloSottile/age/master/scripts/install.sh | sudo bash
          age --version

      - name: Create backup
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          DATE=$(date +%Y-%m-%d)
          BACKUP_FILE="ofeee-backup-${DATE}.sql"
          
          # Create backup
          pg_dump "$DATABASE_URL_DIRECT" > "$BACKUP_FILE"
          
          # Encrypt with age
          age -r "$BACKUP_AGE_RECIPIENT" -o "$BACKUP_FILE.age" "$BACKUP_FILE"
          
          # Delete unencrypted backup
          rm "$BACKUP_FILE"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: "database-backup-${{ github.event_name }}"
          path: "*.sql.age"
          retention-days: 30
